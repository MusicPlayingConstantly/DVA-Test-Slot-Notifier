<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 340px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #1A1A18;
    background: #F7F6F2;
    padding: 14px;
  }

  h1 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .sub { font-size: 11px; color: #6B6A65; margin-bottom: 12px; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: #F1EFE8;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 12px;
  }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: #9B9A96; }
  .dot.on { background: #3B6D11; }
  .dot.bad { background: #A32D2D; }

  section { margin-bottom: 12px; }

  label {
    display: block;
    font-size: 11px;
    color: #6B6A65;
    margin-bottom: 3px;
    margin-top: 6px;
  }
  label:first-of-type { margin-top: 0; }

  input, select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid rgba(0,0,0,0.18);
    border-radius: 5px;
    background: #fff;
    font-size: 12px;
  }

  .centres-box {
    max-height: 140px;
    overflow-y: auto;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 6px;
    padding: 6px;
    background: #fff;
  }

  .centre-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 4px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
  }
  .centre-row:hover { background: #F1EFE8; }
  .centre-row input { width: auto; margin: 0; }

  .btn {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.18);
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn:hover { background: #F1EFE8; }
  .btn-primary { background: #1A1A18; color: #fff; border-color: #1A1A18; }
  .btn-primary:hover { opacity: 0.88; background: #1A1A18; }
  .btn-stop { color: #791F1F; border-color: #A32D2D; background: #FCEBEB; }

  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }

  .hint {
    font-size: 11px;
    color: #9B9A96;
    margin-top: 4px;
  }

  .divider { border: none; border-top: 1px solid rgba(0,0,0,0.08); margin: 10px 0; }

  details summary {
    font-size: 12px;
    color: #185FA5;
    cursor: pointer;
    margin-bottom: 6px;
  }

  .log {
    max-height: 90px;
    overflow-y: auto;
    font-size: 11px;
    font-family: monospace;
    color: #6B6A65;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 5px;
    padding: 6px;
  }
</style>
</head>
<body>

  <h1>DVA Test Slot Notifier</h1>
  <div class="sub">Monitors NIDirect for new practical test slots</div>

  <div class="status-row">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Open the DVA booking tab to begin</span>
  </div>

  <section>
    <label>Test centres to monitor</label>
    <div class="centres-box" id="centresBox">
      <div class="hint">Open the DVA booking page first — centres load from the page's own dropdown.</div>
    </div>
  </section>

  <section>
    <label>Check every</label>
    <select id="intervalSelect">
      <option value="5">5 minutes</option>
      <option value="10">10 minutes</option>
      <option value="15">15 minutes</option>
      <option value="30">30 minutes</option>
      <option value="60">60 minutes</option>
    </select>

    <label>Search how far ahead</label>
    <select id="weeksSelect">
      <option value="4">4 weeks</option>
      <option value="8" selected>8 weeks</option>
      <option value="12">12 weeks</option>
      <option value="26">26 weeks</option>
    </select>
  </section>

  <hr class="divider" />

  <section>
    <details>
      <summary>Email alerts (EmailJS)</summary>
      <label>Public key</label>
      <input type="text" id="ejsPub" placeholder="user_xxxxx" />
      <label>Service ID</label>
      <input type="text" id="ejsSvc" placeholder="service_xxxxx" />
      <label>Template ID</label>
      <input type="text" id="ejsTpl" placeholder="template_xxxxx" />
      <label>Send to</label>
      <input type="email" id="notifyEmail" placeholder="you@example.com" />
    </details>
  </section>

  <div class="row">
    <button class="btn btn-primary" id="startBtn">Start monitoring</button>
    <button class="btn btn-stop" id="stopBtn" style="display:none">Stop</button>
  </div>
  <button class="btn" id="checkNowBtn">Check now</button>

  <hr class="divider" />

  <section>
    <label>Recent activity</label>
    <div class="log" id="logBox">No checks run yet.</div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
